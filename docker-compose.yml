services:
  postgres:
    image: postgres:17
    container_name: desvsecops_postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: devsecops_pipeline

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devsecops_pipeline"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - devsecops_network

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile

    container_name: desvsecops-api

    restart: always

    env_file:
      - ./api/.env

    ports:
      - "5000:5000"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - devsecops_network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile

    container_name: desvsecops-client

    restart: always

    ports:
      - "80:80"

    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  devsecops_network:
    driver: bridge
